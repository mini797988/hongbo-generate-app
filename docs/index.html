<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브릿지 커피 홍보 자동화</title>
<meta name="description" content="가게 사진을 인스타그램용으로 바꾸고, 채널별 홍보 문구를 만들어 주는 페이지">
<style>
  :root {
    --bg: #f7f4ef;
    --card: #ffffff;
    --text: #2b2622;
    --muted: #7a7068;
    --line: #e6dfd6;
    --accent: #7a4a2b;
    --accent-ink: #ffffff;
    --soft: #f1e9df;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-top: 18px;
  }
  h2 { margin: 0 0 4px; font-size: 1.15rem; }
  h2 .no {
    display: inline-block; width: 26px; height: 26px; line-height: 26px;
    text-align: center; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    font-size: .85rem; margin-right: 8px;
  }
  .hint { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
  button, .btn {
    font: inherit; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    border-radius: 10px; padding: 9px 16px;
  }
  button.ghost, .btn.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .drop {
    border: 2px dashed var(--line); border-radius: 12px; background: var(--soft);
    padding: 26px 14px; text-align: center; color: var(--muted);
  }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .drop input { display: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .thumb { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .thumb div { padding: 6px 8px; font-size: .8rem; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .thumb a { color: var(--accent); text-decoration: none; font-weight: 600; }
  label { display: block; font-weight: 600; font-size: .92rem; margin: 12px 0 4px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  textarea { min-height: 96px; resize: vertical; }
  small { color: var(--muted); }
  .out { margin-top: 14px; }
  .out h3 { margin: 18px 0 6px; font-size: 1rem; }
  .box { border: 1px solid var(--line); background: #fcfaf7; border-radius: 10px; padding: 12px 14px; }
  .box pre { margin: 0; white-space: pre-wrap; word-break: keep-all; font: inherit; }
  .box .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
  .box button { padding: 4px 12px; font-size: .85rem; }
  .msg { color: var(--muted); font-size: .9rem; margin-top: 10px; }
  .msg.err { color: #b3261e; }
  footer { margin-top: 24px; color: var(--muted); font-size: .85rem; text-align: center; }
  @media (max-width: 480px) { .wrap { padding-top: 18px; } section { padding: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>브릿지 커피 홍보 자동화</h1>
    <p>사진을 인스타그램용으로 바꾸고, 채널별 홍보 문구를 만들어 드립니다.</p>
  </header>

  <section>
    <h2><span class="no">1</span>사진 바꾸기</h2>
    <p class="hint">jpg, png 사진을 올리면 가운데를 기준으로 1080 x 1080 정사각형으로 자르고 로고를 넣습니다. 사진은 이 기기 안에서만 처리되고 어디에도 올라가지 않습니다.</p>
    <label class="drop" id="drop">
      여기에 사진을 끌어다 놓거나 눌러서 고르세요
      <input type="file" id="files" accept="image/jpeg,image/png" multiple>
    </label>
    <div class="row">
      <button id="zipBtn" disabled>전체 내려받기 (zip)</button>
      <button id="clearBtn" class="ghost" disabled>비우기</button>
    </div>
    <div class="msg" id="photoMsg"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2><span class="no">2</span>가게 정보 적기</h2>
    <p class="hint">적은 내용은 이 브라우저에만 저장됩니다. 매주 "이번 주 홍보할 것"만 고치면 됩니다.</p>
    <label for="name">가게 이름</label>
    <input type="text" id="name">
    <label for="loc">위치</label>
    <input type="text" id="loc">
    <label for="feat">가게 특징 <small>(쉼표와 띄어쓰기로 구분: 예) 직접 로스팅, 1인 좌석 많음)</small></label>
    <input type="text" id="feat">
    <label for="cust">주 고객층</label>
    <input type="text" id="cust">
    <label for="news">이번 주 홍보할 것 <small>(한 줄에 하나씩, 줄 앞에 - 를 붙여도 됩니다)</small></label>
    <textarea id="news"></textarea>
    <div class="row">
      <button id="genBtn">문구 만들기</button>
      <button id="resetBtn" class="ghost">처음 내용으로</button>
    </div>
    <div class="msg" id="textMsg"></div>
  </section>

  <section id="result" hidden>
    <h2><span class="no">3</span>만들어진 문구</h2>
    <p class="hint">마음에 드는 글의 [복사] 버튼을 누른 뒤 각 앱에 붙여 넣으세요.</p>
    <div class="out" id="out"></div>
  </section>

  <footer>사진과 가게 정보는 서버로 전송되지 않습니다.</footer>
</div>

<script>
(() => {
  "use strict";

  // ---------- 사진 변환 (사진변환.py와 같은 규칙) ----------
  const SIZE = 1080;
  const LOGO_RATIO = 0.15;   // 사진 가로 폭의 15%
  const MARGIN = 40;         // 가장자리에서 안쪽으로 40px
  const PAD = 16;            // 로고 둘레 흰 바탕 두께
  const RADIUS = 18;         // 흰 바탕 모서리
  const WHITE_ALPHA = 120 / 255;

  let logoImg = null;
  const logoReady = new Promise(resolve => {
    const img = new Image();
    img.onload = () => { logoImg = img; resolve(); };
    img.onerror = () => resolve();   // 로고가 없으면 로고 없이 진행
    img.src = "logo.png";
  });

  let results = []; // { name, blob, url }

  const $ = id => document.getElementById(id);
  const grid = $("grid"), photoMsg = $("photoMsg");

  function today() {
    const d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  }

  async function decode(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) { /* 아래로 */ }
    }
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("사진을 열 수 없습니다")); };
      img.src = url;
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render(img) {
    const w = img.width, h = img.height;
    const side = Math.min(w, h);                 // 가운데 기준 정사각형 (비율 유지)
    const sx = (w - side) / 2, sy = (h - side) / 2;
    const c = document.createElement("canvas");
    c.width = c.height = SIZE;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);

    if (logoImg) {
      const lw = Math.round(SIZE * LOGO_RATIO);
      const lh = Math.max(1, Math.round(logoImg.naturalHeight * lw / logoImg.naturalWidth));
      const bw = lw + PAD * 2, bh = lh + PAD * 2;
      const bx = SIZE - MARGIN - bw, by = SIZE - MARGIN - bh;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.14)";
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = "rgba(255,255,255," + WHITE_ALPHA + ")";
      roundRect(ctx, bx, by, bw, bh, RADIUS);
      ctx.fill();
      ctx.restore();
      ctx.drawImage(logoImg, bx + PAD, by + PAD, lw, lh);
    }
    return new Promise(res => c.toBlob(res, "image/jpeg", 0.95));
  }

  function clearResults() {
    results.forEach(r => URL.revokeObjectURL(r.url));
    results = [];
    grid.innerHTML = "";
    $("zipBtn").disabled = $("clearBtn").disabled = true;
  }

  async function handleFiles(fileList) {
    const all = Array.from(fileList);
    const files = all.filter(f => /^image\/(jpeg|png)$/.test(f.type));
    const skipped = all.length - files.length;
    if (!files.length) {
      photoMsg.className = "msg err";
      photoMsg.textContent = "jpg 또는 png 사진만 변환할 수 있습니다.";
      return;
    }
    clearResults();
    photoMsg.className = "msg";
    photoMsg.textContent = "변환 중입니다...";
    await logoReady;
    const prefix = today();
    let n = 0, failed = 0;
    for (const f of files) {
      try {
        const img = await decode(f);
        const blob = await render(img);
        if (img.close) img.close();
        n++;
        const name = prefix + "_" + String(n).padStart(2, "0") + ".jpg";
        const url = URL.createObjectURL(blob);
        results.push({ name, blob, url });
        const card = document.createElement("div");
        card.className = "thumb";
        card.innerHTML = '<img alt=""><div><span></span><a>내려받기</a></div>';
        card.querySelector("img").src = url;
        card.querySelector("span").textContent = name;
        const a = card.querySelector("a");
        a.href = url; a.download = name;
        grid.appendChild(card);
      } catch (e) {
        failed++;
      }
    }
    photoMsg.className = "msg" + (n ? "" : " err");
    photoMsg.textContent = n + "장을 만들었습니다." +
      (skipped ? " (jpg/png가 아닌 " + skipped + "개는 건너뜀)" : "") +
      (failed ? " (열 수 없는 사진 " + failed + "개는 건너뜀)" : "");
    $("zipBtn").disabled = $("clearBtn").disabled = !n;
  }

  const drop = $("drop"), input = $("files");
  input.addEventListener("change", () => { handleFiles(input.files); input.value = ""; });
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));
  $("clearBtn").addEventListener("click", () => { clearResults(); photoMsg.textContent = ""; });

  // ---------- zip (압축 없이 묶기) ----------
  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files) { // files: [{ name, data: Uint8Array }]
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const crc = crc32(f.data), size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
      lh.setUint16(26, nameBytes.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nameBytes, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, nameBytes.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nameBytes);
      offset += 30 + nameBytes.length + size;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
  }
  $("zipBtn").addEventListener("click", async () => {
    if (!results.length) return;
    const files = [];
    for (const r of results) files.push({ name: r.name, data: new Uint8Array(await r.blob.arrayBuffer()) });
    const url = URL.createObjectURL(makeZip(files));
    const a = document.createElement("a");
    a.href = url; a.download = "홍보사진_" + today() + ".zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  // ---------- 홍보 문구 (사진변환.py의 기본 틀과 같은 규칙) ----------
  const DEFAULTS = {
    name: "브릿지 커피",
    loc: "광주 북구 비엔날레 지구",
    feat: "직접 로스팅하는 스페셜티 커피, 조용한 1인 좌석 많음",
    cust: "30~40대 직장인, 근처 사무실 손님",
    news: "- 신메뉴 '흑임자 라떼' 5,500원, 국산 흑임자를 직접 갈아서 넣음, 고소하고 달지 않음\n- 오전 11시 이전 방문 시 아메리카노 500원 할인"
  };
  const FIELDS = ["name", "loc", "feat", "cust", "news"];
  const STORE_KEY = "bridge-promo-info-v1";

  function loadInfo() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved && typeof saved === "object") return Object.assign({}, DEFAULTS, saved);
    } catch (e) { /* 저장소를 못 쓰면 기본값 */ }
    return Object.assign({}, DEFAULTS);
  }
  function saveInfo(info) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(info)); } catch (e) { /* 무시 */ }
  }
  function fillForm(info) { FIELDS.forEach(k => { $(k).value = info[k]; }); }
  function readForm() {
    const o = {};
    FIELDS.forEach(k => { o[k] = $(k).value.trim(); });
    return o;
  }

  const split = s => s.split(", ").map(x => x.trim()).filter(Boolean);

  function parseInfo(f) {
    return {
      name: f.name,
      loc: f.loc,
      feat: split(f.feat),
      cust: f.cust,
      news: f.news.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
        .map(l => (/^[-•·*]/.test(l) ? l.slice(1).trim() : l).replace(/\.$/, ""))
        .filter(Boolean)
    };
  }

  function hashtags(info) {
    const text = info.news.join(" ");
    const region = info.loc.split(/\s+/).filter(Boolean);
    const cand = [];
    if (region.length >= 2) {
      cand.push(region[0] + "카페", region[1] + "카페", region[0] + region[1] + "카페", region[0] + "커피");
    } else if (region.length) {
      cand.push(region[0] + "카페", region[0] + "커피");
    }
    if (region.length > 2) cand.push(region.slice(2).join(""));
    region.slice(2).forEach(w => { if (!["지구", "일대", "근처"].includes(w)) cand.push(w); });
    const featText = info.feat.join(" ");
    if (featText.includes("스페셜티")) cand.push("스페셜티커피");
    if (featText.includes("로스팅")) cand.push("로스터리카페");
    const re = /['‘"“]([^'’"”]+)['’"”]/g;
    let m;
    while ((m = re.exec(text))) cand.push(m[1].replace(/\s/g, ""));
    if (text.includes("신메뉴")) cand.push("신메뉴", "카페신메뉴");
    if (text.includes("할인")) cand.push("카페할인");
    if (info.name) cand.push(info.name.replace(/\s/g, ""));
    cand.push("카페스타그램", "커피스타그램", "카페추천", "직장인카페", "혼카페", "동네카페", "오늘의커피");
    const tags = [];
    cand.forEach(w => { const t = "#" + w.replace(/^#+/, ""); if (!tags.includes(t)) tags.push(t); });
    return tags.slice(0, 10);
  }

  function build(f) {
    const info = parseInfo(f);
    const news = info.news;
    if (!news.length) return null;
    const name = info.name || "저희 가게";
    const loc = info.loc;
    const first = news[0];
    const firstTitle = split(first)[0] || first;
    const eventWords = ["할인", "이벤트", "증정", "무료", "쿠폰", "%"];
    const event = news.find(s => eventWords.some(w => s.includes(w))) || news[news.length - 1];
    const other = news.find(s => s !== event);
    const placeLine = loc ? loc + "에서 기다리겠습니다." : "기다리겠습니다.";

    const emotional = [name + "입니다.", ""]
      .concat(info.feat.slice(0, 2).map(t => t + "."))
      .concat(["", "이번 주 소식입니다.", firstTitle + ".", "", placeLine]);
    const informative = ["이번 주 " + name + " 안내입니다.", ""]
      .concat(news.map(s => "- " + s));
    if (loc) informative.push("", "위치: " + loc);
    const eventTitle = event.includes("할인") ? "할인 안내" : "이벤트 안내";
    const eventual = ["이번 주 " + eventTitle + "입니다.", "", event + "."];
    if (other) eventual.push("", (split(other)[0] || other) + "도 있습니다.");
    eventual.push("", placeLine);

    const body = ["안녕하세요. " + name + "입니다.", ""];
    if (loc) body.push("저희 가게는 " + loc + "에 있습니다.");
    if (info.feat.length) body.push("가게의 특징은 이렇습니다.", ...info.feat.map(t => "- " + t));
    if (info.cust) body.push("", "주로 찾아 주시는 분들은 " + info.cust + "입니다.", "오시는 분들이 편하게 머물다 가실 수 있게 준비하고 있습니다.");
    body.push("", "이번 주 소식을 알려드립니다.", "");
    const nums = ["하나", "둘", "셋", "넷", "다섯", "여섯"];
    news.forEach((item, i) => {
      const parts = split(item);
      body.push((nums[i] || (i + 1)) + ". " + (parts[0] || item), ...parts.slice(1).map(t => "- " + t), "");
    });
    body.push("한눈에 정리하면 이렇습니다.", ...news.map(s => "- " + s));
    body.push("", "자세한 내용은 가게에서 편하게 물어봐 주십시오.", placeLine, "읽어 주셔서 감사합니다.");

    const kakao = ["안녕하세요, " + name + "입니다. 이번 주 소식을 전해드립니다.", "- " + news[0]];
    if (news.length > 1) kakao.push("- " + news[1] + (news.length > 2 ? " / " + news.slice(2).join(" / ") : ""));

    const tags = hashtags(info).join(" ");
    return {
      insta: [["감성형", emotional.join("\n")], ["정보형", informative.join("\n")], ["이벤트형", eventual.join("\n")]],
      tags,
      blogTitle: name + " 이번 주 소식 - " + firstTitle,
      blogBody: body.join("\n"),
      kakao: kakao.join("\n")
    };
  }

  function boxHTML(label, text, withCount) {
    const el = document.createElement("div");
    el.className = "box";
    el.innerHTML = '<div class="meta"><span></span><button type="button">복사</button></div><pre></pre>';
    el.querySelector("span").textContent = label + (withCount ? " (" + text.length + "자)" : "");
    el.querySelector("pre").textContent = text;
    const btn = el.querySelector("button");
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e2) { /* 무시 */ }
        ta.remove();
      }
      btn.textContent = "복사됨";
      setTimeout(() => { btn.textContent = "복사"; }, 1500);
    });
    return el;
  }

  function section(title, boxes) {
    const frag = document.createDocumentFragment();
    const h = document.createElement("h3");
    h.textContent = title;
    frag.appendChild(h);
    boxes.forEach(b => frag.appendChild(b));
    return frag;
  }

  $("genBtn").addEventListener("click", () => {
    const f = readForm();
    saveInfo(f);
    const r = build(f);
    const msg = $("textMsg");
    if (!r) {
      msg.className = "msg err";
      msg.textContent = "'이번 주 홍보할 것'을 한 줄 이상 적어 주세요.";
      return;
    }
    msg.className = "msg";
    msg.textContent = "";
    const out = $("out");
    out.innerHTML = "";
    out.appendChild(section("인스타그램용", r.insta.map(([l, t]) => boxHTML(l, t, true)).concat([boxHTML("해시태그", r.tags, false)])));
    out.appendChild(section("네이버 블로그용", [
      boxHTML("제목", r.blogTitle, false),
      boxHTML("본문", r.blogBody, true),
      boxHTML("해시태그", r.tags, false)
    ]));
    out.appendChild(section("카카오톡 단골 공지용", [boxHTML("공지", r.kakao, false)]));
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  $("resetBtn").addEventListener("click", () => { fillForm(DEFAULTS); saveInfo(DEFAULTS); });
  FIELDS.forEach(k => $(k).addEventListener("input", () => saveInfo(readForm())));
  fillForm(loadInfo());
})();
</script>
</body>
</html>
